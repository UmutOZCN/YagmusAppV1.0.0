services:
  - type: web
    name: yagmus-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: yagmus-db-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /data
      # Uncomment to use PostgreSQL instead of SQLite:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: yagmus-postgres
      #     property: connectionString

  - type: web
    name: yagmus-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: npx serve -s frontend/build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: yagmus-backend
          property: host

